document.addEventListener("DOMContentLoaded", () => {
    const COOKIE_NAME = 'rpages_sid';
    const COOKIE_DAYS = 7;

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function setCookie(name, value, days) {
        let expires = "";
        if (days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/";
    }

    function generateSid() {
         return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    let sid = getCookie(COOKIE_NAME);
    if (!sid) {
        sid = generateSid();
        setCookie(COOKIE_NAME, sid, COOKIE_DAYS);
    }

    const baseEndpoint = "https://leads-v2.rpages.com.br/api/track/pageview/39546a2a06d671b4f";
    const trackingUrl = new URL(baseEndpoint);
    const currentParams = new URLSearchParams(window.location.search);

    // Anexa todos os par&acirc;metros da URL atual (UTMs, etc) &agrave; URL de rastreamento
    currentParams.forEach((value, key) => {
        trackingUrl.searchParams.append(key, value);
    });

    const payload = {
        ref: document.referrer || window.location.href,
        sid: sid
    };

    navigator.sendBeacon(trackingUrl.toString(), new Blob([JSON.stringify(payload)], { type: "text/plain" }));

    window.dispatchEvent(new CustomEvent('rpages_pageview_sent', { detail: { sid: sid } }));
});

<script>
  // Configure sua URL base aqui
  const BASE_URL = "https://leads-v2.rpages.com.br/api/forms";
  const PROJECT_UNIQID = "39546a2a06d671b4f";

  function getFormMsgKey(form) {
    return form.getAttribute('rocket-form-id') || form.id || 'rocket-form';
  }

  function escSelector(value) {
    // evita quebrar querySelector em chaves comuns
    if (window.CSS && CSS.escape) return CSS.escape(String(value));
    return String(value).replace(/["\\]/g, '\\$&');
  }

  function removeRocketMessage(form) {
    const key = getFormMsgKey(form);
    const selector = '[data-rocket-form-message-for="' + escSelector(key) + '"]';
    const existing = form.parentElement ? form.parentElement.querySelector(selector) : null;
    if (existing) existing.remove();
  }

  function createIconSuccess() {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("style", "width:16px; height:16px; flex:0 0 auto; display:block;");
    svg.setAttribute("viewBox", "0 0 20 20");
    svg.setAttribute("fill", "currentColor");
    svg.setAttribute("aria-hidden", "true");

    const path = document.createElementNS(ns, "path");
    path.setAttribute("fill-rule", "evenodd");
    path.setAttribute("clip-rule", "evenodd");
    path.setAttribute("d", "M16.704 5.29a1 1 0 010 1.414l-7.5 7.5a1 1 0 01-1.414 0l-3.5-3.5A1 1 0 015.704 9.29l2.793 2.793 6.793-6.793a1 1 0 011.414 0z");
    svg.appendChild(path);

    return svg;
  }

  function createIconError() {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("style", "width:16px; height:16px; flex:0 0 auto; display:block;");
    svg.setAttribute("viewBox", "0 0 20 20");
    svg.setAttribute("fill", "currentColor");
    svg.setAttribute("aria-hidden", "true");

    const path = document.createElementNS(ns, "path");
    path.setAttribute("fill-rule", "evenodd");
    path.setAttribute("clip-rule", "evenodd");
    path.setAttribute("d", "M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z");
    svg.appendChild(path);

    return svg;
  }

  function insertRocketMessage(form, type, text) {
    removeRocketMessage(form);

    const key = getFormMsgKey(form);

    const p = document.createElement("p");
    p.setAttribute("data-rocket-form-message", type);
    p.setAttribute("data-rocket-form-message-for", key);

    if (type === "success") {
      p.setAttribute(
        "style",
        "margin-top:8px; display:flex; align-items:center; gap:8px; font-size:14px; line-height:1; color:#047857;"
      );
      p.appendChild(createIconSuccess());
    } else {
      p.setAttribute(
        "style",
        "margin-top:8px; display:flex; align-items:center; gap:8px; font-size:14px; line-height:1; color:#be123c;"
      );
      p.appendChild(createIconError());
    }

    // &#9989; sem template string e sem escape custom: texto vai como texto puro
    p.appendChild(document.createTextNode(text || ""));

    // &#9989; abaixo do form
    form.insertAdjacentElement("afterend", p);
  }

  function getSubmitButtons(form) {
    const buttons = Array.from(form.querySelectorAll('button[type="submit"], input[type="submit"]'));
    if (buttons.length === 0) {
      const firstBtn = form.querySelector("button");
      if (firstBtn) buttons.push(firstBtn);
    }
    return buttons;
  }

  function setSubmittingState(form, isSubmitting) {
    const buttons = getSubmitButtons(form);

    buttons.forEach((btn) => {
      if (btn.tagName.toLowerCase() === "button") {
        if (!btn.dataset.rocketOriginalText) btn.dataset.rocketOriginalText = btn.textContent || "";
        btn.textContent = isSubmitting ? "Enviando..." : btn.dataset.rocketOriginalText;
      } else {
        if (!btn.dataset.rocketOriginalValue) btn.dataset.rocketOriginalValue = btn.value || "";
        btn.value = isSubmitting ? "Enviando..." : btn.dataset.rocketOriginalValue;
      }

      btn.disabled = !!isSubmitting;
      btn.setAttribute("aria-disabled", isSubmitting ? "true" : "false");
      btn.style.opacity = isSubmitting ? "0.7" : "";
      btn.style.cursor = isSubmitting ? "not-allowed" : "";
    });
  }

  async function sendFormToGoBackend(params) {
    const url = params.url;
    const projectUniqid = params.projectUniqid;
    const formKey = params.formKey;
    const fields = params.fields;

    if (!projectUniqid || !formKey) {
      throw new Error("projectUniqid e formKey s&atilde;o obrigat&oacute;rios");
    }

    const formData = new FormData();
    formData.append("project_uniqid", projectUniqid);
    formData.append("form_key", formKey);

    for (const key in fields) {
      if (!Object.prototype.hasOwnProperty.call(fields, key)) continue;
      const value = fields[key];

      if (typeof value === "object" && value !== null) {
        formData.append(key, JSON.stringify(value));
      } else {
        formData.append(key, value);
      }
    }

    // &#9888;&#65039; N&atilde;o setar Content-Type manualmente com FormData
    const res = await fetch(url, {
      method: "POST",
      headers: { "X-Requested-With": "XMLHttpRequest" },
      body: formData
    });

    const data = await res.json().catch(() => null);
    if (!res.ok) {
      throw new Error("Erro " + res.status + ": " + JSON.stringify(data));
    }
    return data;
  }

  async function sendFormData(formId = "myForm") {
    const form = document.getElementById(formId);

    if (!form || form.tagName.toLowerCase() !== "form") {
      console.error("sendFormData: formul&aacute;rio n&atilde;o encontrado ou n&atilde;o &eacute; <form>.");
      return;
    }

    // remove msg antiga sempre que enviar novamente
    removeRocketMessage(form);

    const msgSuccess =
      form.getAttribute("data-rocket-msg-sucess") ||
      form.getAttribute("data-rocket-msg-success") ||
      "Enviado com sucesso.";

    const msgError =
      form.getAttribute("data-rocket-msg-error") ||
      "N&atilde;o foi poss&iacute;vel enviar.";

    const formKey = form.getAttribute("rocket-form-id");
    const webhookUrl = form.getAttribute("data-webhook-url");
    const redirectUrl = form.getAttribute("data-redirect-url");

    const fd = new FormData(form);
    const fields = {};
    fd.forEach((value, key) => (fields[key] = value));

    setSubmittingState(form, true);

    try {
      const result = await sendFormToGoBackend({
        url: BASE_URL,
        projectUniqid: PROJECT_UNIQID,
        formKey: formKey,
        fields: fields
      });

      console.log("Formul&aacute;rio enviado com sucesso:", result);
      insertRocketMessage(form, "success", msgSuccess);

      if (webhookUrl) {
        try {
          await fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(fields)
          });
          console.log("Webhook disparado com sucesso.");
        } catch (webhookError) {
          console.error("Erro ao disparar webhook:", webhookError);
        }
      }

      if (redirectUrl) {
        try {
          const urlObj = new URL(
            redirectUrl.startsWith("http")
              ? redirectUrl
              : window.location.origin + redirectUrl
          );

          for (const key in fields) {
            if (Object.prototype.hasOwnProperty.call(fields, key)) {
              urlObj.searchParams.append(key, fields[key]);
            }
          }

          // Add current URL parameters
          const currentParams = new URLSearchParams(window.location.search);
          currentParams.forEach((value, key) => {
              if (!urlObj.searchParams.has(key)) {
                  urlObj.searchParams.append(key, value);
              }
          });

          window.location.href = urlObj.toString();
          return;
        } catch (redirectError) {
          console.error("Erro ao processar redirecionamento:", redirectError);
          if (redirectUrl) {
            window.location.href = redirectUrl;
            return;
          }
        }
      }
    } catch (error) {
      console.error("Erro ao enviar formul&aacute;rio:", error);
      insertRocketMessage(form, "error", msgError);
    } finally {
      setSubmittingState(form, false);
    }
  }
